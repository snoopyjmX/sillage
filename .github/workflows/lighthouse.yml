name: Lighthouse CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lighthouse:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v3
        with:
          # Mantenha igual à versão da devDependency `supabase` no package.json
          version: 2.119.0

      - name: Start local Supabase (migrations + seed)
        # O catálogo precisa de dados reais para a auditoria medir a página de verdade
        run: supabase start

      - name: Export Supabase URL and anon key for the build
        # Só a URL e a anon key (públicas por desenho) vão para o build; nada de service_role.
        run: |
          supabase status -o env > "$RUNNER_TEMP/supabase.env"
          echo "VITE_SUPABASE_URL=$(sed -n 's/^API_URL="\(.*\)"$/\1/p' "$RUNNER_TEMP/supabase.env")" >> "$GITHUB_ENV"
          echo "VITE_SUPABASE_ANON_KEY=$(sed -n 's/^ANON_KEY="\(.*\)"$/\1/p' "$RUNNER_TEMP/supabase.env")" >> "$GITHUB_ENV"

      - name: Build
        run: npm run build

      - name: Lighthouse CI
        # npx evita adicionar o @lhci/cli ao package.json; a versão fica fixa para o resultado ser reproduzível
        run: npx --yes @lhci/cli@0.15.1 autorun --config=lighthouserc.json
