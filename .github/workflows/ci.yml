name: CI

on:
  pull_request:
  push:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Format check
        run: npm run format:check

      - name: Contrast check
        run: npm run check:contrast

      - name: Unit and component tests
        run: npm run test

      - name: Build
        run: npm run build

  database:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v3
        with:
          # Mantenha igual à versão da devDependency `supabase` no package.json
          version: 2.119.0

      - name: Start local Supabase
        run: supabase start

      - name: Database tests (pgTAP)
        run: supabase test db

  e2e:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v3
        with:
          # Mantenha igual à versão da devDependency `supabase` no package.json
          version: 2.119.0

      - name: Start local Supabase (migrations + seed)
        run: supabase start

      - name: Export Supabase URL and anon key for the build
        # Só a URL e a anon key (públicas por desenho) vão para o build; nada de service_role.
        run: |
          supabase status -o env > "$RUNNER_TEMP/supabase.env"
          echo "VITE_SUPABASE_URL=$(sed -n 's/^API_URL="\(.*\)"$/\1/p' "$RUNNER_TEMP/supabase.env")" >> "$GITHUB_ENV"
          echo "VITE_SUPABASE_ANON_KEY=$(sed -n 's/^ANON_KEY="\(.*\)"$/\1/p' "$RUNNER_TEMP/supabase.env")" >> "$GITHUB_ENV"

      - name: Install Playwright browsers
        # Os dois projetos (Desktop Chromium e Pixel 7) usam Chromium
        run: npx playwright install --with-deps chromium

      - name: E2E tests (production build)
        run: npx playwright test

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
