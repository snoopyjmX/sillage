<!doctype html>

    />
    <meta
      data-static-seo
      property="og:title"
      content="Sillage — Enciclopédia olfativa e diário de perfumaria"
    />
    <meta
      data-static-seo
      property="og:description"
      content="Sillage: catálogo de perfumes com pirâmide olfativa, coleção, avaliações e o Perfume do Dia. Uma enciclopédia olfativa e um diário pessoal."
    />
    <meta data-static-seo property="og:type" content="website" />
    <meta data-static-seo property="og:url" content="https://sillage-ashy-gamma.vercel.app/" />

    <meta data-static-seo name="twitter:card" content="summary_large_image" />
    <meta
      data-static-seo
      name="twitter:title"
      content="Sillage — Enciclopédia olfativa e diário de perfumaria"
    />
    <meta

      data-static-seo
      name="twitter:image"
      content="https://sillage-ashy-gamma.vercel.app/og-image.jpg"
    />
    <!-- Fontes críticas (corpo e títulos): o preload tira a descoberta delas do fim da cascata -->
    <link
      rel="preload"
      as="font"
      type="font/woff2"
      crossorigin
      href="/node_modules/@fontsource/inter/files/inter-latin-400-normal.woff2"
    />
    <link
      rel="preload"
      as="font"
      type="font/woff2"
      crossorigin
      href="/node_modules/@fontsource/fraunces/files/fraunces-latin-500-normal.woff2"
    />
    <link
      rel="preload"
      as="font"
      type="font/woff2"
      crossorigin
      href="/node_modules/@fontsource/inter/files/inter-latin-500-normal.woff2"
    />
    <link
      rel="preload"
      as="font"
      type="font/woff2"
      crossorigin
      href="/node_modules/@fontsource/fraunces/files/fraunces-latin-600-normal.woff2"
    />
    <script>
      // Aplica o tema antes da primeira pintura (evita o "flash" do tema errado).
      // Mantenha a chave igual a THEME_STORAGE_KEY em src/lib/theme.ts.
      (function () {
        try {
          var stored = localStorage.getItem('sillage-theme');
          var dark =
            stored === 'dark' ||
            ((stored === null || stored === 'system') &&
              window.matchMedia('(prefers-color-scheme: dark)').matches);
          var root = document.documentElement;
          if (dark) root.classList.add('dark');
          root.style.colorScheme = dark ? 'dark' : 'light';
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
